# Pre-commit hooks for opencode_initializer
# Run: pre-commit install
# Skip: SKIP=bash-syntax,shellcheck,secrets git commit -m "..."
repos:
  - repo: local
    hooks:
      - id: bash-syntax
        name: Bash syntax check
        entry: bash -n
        language: system
        files: \.sh$
        types: [shell]
        fail_fast: true

      - id: shellcheck
        name: ShellCheck
        entry: shellcheck -S error
        language: system
        files: \.sh$
        types: [shell]

      - id: secrets
        name: Secret scan (API keys, tokens)
        entry: bash -c 'grep -rnE "sk-[a-zA-Z0-9]{20,}|[a-zA-Z0-9_-]{32,}" "$@" | grep -v ".pre-commit-config.yaml" | grep -v "tests/" && exit 1 || exit 0' --
        language: system
        files: \.sh$|\.py$|\.json$|\.yaml$|\.yml$|\.env$
        exclude: tests/|\.pre-commit-config\.yaml|\.example$

      - id: grep-p-macos
        name: No grep -P (macOS compat)
        entry: bash -c '! grep -rPn "grep\s+-[A-Za-z]*P" "$@"' --
        language: system
        files: \.sh$
        exclude: tests/

      - id: trivy-critical
        name: Trivy CRITICAL check
        entry: bash -c 'command -v trivy >/dev/null && trivy fs --severity CRITICAL --exit-code 1 --skip-dirs tests . || echo "[pre-commit] Trivy not installed — skipping"'
        language: system
        always_run: true
        pass_filenames: false
