name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install ShellCheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi
          # GitHub runners ship it; other runners (act-based) may not have the
          # package in their apt lists — fall back to the PyPI wheel.
          if sudo -n apt-get install -y shellcheck 2>/dev/null; then exit 0; fi
          python3 -m pip install --user shellcheck-py
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      
      - name: Run ShellCheck on modules
        run: |
          errors=0
          for module in src/lib/*.sh; do
            echo "Checking: $module"
            if ! shellcheck -S error "$module" 2>/dev/null; then
              ((errors++))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors files with errors"
            exit 1
          fi
      
      - name: Run ShellCheck on tests
        run: |
          errors=0
          for test in tests/unit/*.sh tests/integration/*.sh; do
            echo "Checking: $test"
            if ! shellcheck -S error "$test" 2>/dev/null; then
              ((errors++))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors files with errors"
            exit 1
          fi

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency (single source of truth)
        run: bash scripts/check-version-consistency.sh

      - name: Documentation counts match code
        run: bash scripts/check-doc-counts.sh

      - name: Documentation i18n parity
        run: bash scripts/check-docs-parity.sh

      - name: setup.sh line count matches README
        run: bash scripts/check-setup-lines.sh

      - name: No new unreachable modules (dead-code ratchet)
        run: bash scripts/audit-module-reachability.sh --baseline src/data/dead-modules.baseline
