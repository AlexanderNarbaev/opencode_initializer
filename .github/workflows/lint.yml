name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      
      - name: Run ShellCheck on modules
        run: |
          errors=0
          for module in src/lib/*.sh; do
            echo "Checking: $module"
            if ! shellcheck -S warning "$module" 2>/dev/null; then
              ((errors++))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors files with warnings"
            exit 1
          fi
      
      - name: Run ShellCheck on tests
        run: |
          errors=0
          for test in tests/unit/*.sh tests/integration/*.sh; do
            echo "Checking: $test"
            if ! shellcheck -S warning "$test" 2>/dev/null; then
              ((errors++))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "Found $errors files with warnings"
            exit 1
          fi

  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version consistency (single source of truth)
        run: bash scripts/check-version-consistency.sh

      - name: Documentation counts match code
        run: bash scripts/check-doc-counts.sh

      - name: Documentation i18n parity
        run: bash scripts/check-docs-parity.sh

      - name: setup.sh line count matches README
        run: bash scripts/check-setup-lines.sh

      - name: No new unreachable modules (dead-code ratchet)
        run: bash scripts/audit-module-reachability.sh --baseline src/data/dead-modules.baseline
