name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install test prerequisites
        run: |
          command -v jq >/dev/null 2>&1 || (sudo -n apt-get update -qq && sudo -n apt-get install -y -qq jq) || echo "jq not installable; tests will report if they need it"
          node --version || true

      # Run through the master runner: privilege sandbox (PATH shims) plus a
      # per-test timeout, exactly like a local `bash tests/run_tests.sh`.
      - name: Run unit tests
        env:
          TEST_TIMEOUT: "120"
        run: bash tests/run_tests.sh --section unit
  
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install test prerequisites
        run: command -v jq >/dev/null 2>&1 || (sudo -n apt-get update -qq && sudo -n apt-get install -y -qq jq) || true

      - name: Run integration tests
        env:
          CI: "true"
          GITHUB_ACTIONS: "true"
          TEST_TIMEOUT: "120"
        run: bash tests/run_tests.sh --section integration
  
  python-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pytest testcontainers
          pip install -r requirements.txt || true
      
      - name: Run Python tests
        run: |
          python -m pytest tests/unit/test_*.py -v
          for test in tests/integration/test_*.py; do
            echo "Running: $test"
            python -m pytest "$test" -v || exit 1
          done
  
  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install test prerequisites
        run: command -v jq >/dev/null 2>&1 || (sudo -n apt-get update -qq && sudo -n apt-get install -y -qq jq) || true

      - name: Run E2E smoke tests
        env:
          RUN_E2E: "1"
          TEST_TIMEOUT: "180"
        run: bash tests/run_tests.sh --section e2e
  
  container-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Test Dockerfile syntax
        run: |
          docker build --check . || echo "BuildKit check not available"
      
      - name: Test docker-compose syntax
        run: |
          docker compose config --quiet
      
      - name: Build container (dry-run)
        run: |
          docker build --dry-run . || echo "BuildKit dry-run not available"
  
  benchmarks:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      
      - name: Run benchmarks
        run: |
          for bench in tests/benchmark/benchmark_*.sh; do
            echo "Running: $bench"
            bash "$bench" || echo "WARN: $bench exited with code $?"
          done
