name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run unit tests
        run: |
          for test in tests/unit/test_*.sh; do
            echo "Running: $test"
            bash "$test" || exit 1
          done
  
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Run integration tests
        run: |
          for test in tests/integration/test_*.sh; do
            echo "Running: $test"
            bash "$test" || exit 1
          done
  
  benchmarks:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Run benchmarks
        run: |
          for bench in tests/benchmark/benchmark_*.sh; do
            echo "Running: $bench"
            bash "$bench"
          done
