name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run unit tests
        run: |
          for test in tests/unit/test_*.sh; do
            echo "Running: $test"
            bash "$test" || exit 1
          done
  
  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Run integration tests
        run: |
          export CI=true
          export GITHUB_ACTIONS=true
          for test in tests/integration/test_*.sh; do
            echo "Running: $test"
            bash "$test" || exit 1
          done
  
  python-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install pytest testcontainers
          pip install -r requirements.txt || true
      
      - name: Run Python tests
        run: |
          for test in tests/integration/test_*.py; do
            echo "Running: $test"
            python -m pytest "$test" -v || exit 1
          done
  
  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Run E2E smoke tests
        run: |
          for test in tests/e2e/test_smoke_*.sh; do
            echo "Running: $test"
            bash "$test" || exit 1
          done
  
  container-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Test Dockerfile syntax
        run: |
          docker build --check . || echo "BuildKit check not available"
      
      - name: Test docker-compose syntax
        run: |
          docker compose config --quiet
      
      - name: Build container (dry-run)
        run: |
          docker build --dry-run . || echo "BuildKit dry-run not available"
  
  benchmarks:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      
      - name: Run benchmarks
        run: |
          for bench in tests/benchmark/benchmark_*.sh; do
            echo "Running: $bench"
            bash "$bench" || echo "WARN: $bench exited with code $?"
          done
