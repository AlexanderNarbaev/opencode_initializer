name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest
      
      - name: Build GUI
        run: |
          bun build src/gui/server.js --compile --outfile dist/opencode-gui
      
      - name: Check GUI syntax
        run: |
          node --check src/gui/server.js
