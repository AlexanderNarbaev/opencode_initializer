name: ShellCheck + shfmt
on:
  push:
    branches: [main]
    paths:
      - '**.sh'
  pull_request:
    branches: [main]
    paths:
      - '**.sh'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: |
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck --version
            exit 0
          fi
          # GitHub runners ship it; other runners (act-based) may not have the
          # package in their apt lists — fall back to the PyPI wheel.
          if sudo -n apt-get install -y shellcheck 2>/dev/null; then exit 0; fi
          # PEP 668 images refuse --user installs; try it, then fall back to a venv.
          if python3 -m pip install --user --break-system-packages shellcheck-py 2>/dev/null; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            exit 0
          fi
          python3 -m venv "$HOME/.shellcheck-venv"
          "$HOME/.shellcheck-venv/bin/pip" install --quiet shellcheck-py
          echo "$HOME/.shellcheck-venv/bin" >> "$GITHUB_PATH"
      - name: Run ShellCheck on shell files
        run: |
          errors=0
          for f in $(find . -name '*.sh' -not -path './.git/*' -not -path './node_modules/*' -not -path './upstream/*' -not -path './completions/*'); do
            if ! shellcheck -S error "$f" 2>/dev/null; then
              echo "FAIL: $f"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "ShellCheck failed on $errors files"
            exit 1
          fi
          echo "ShellCheck passed on all shell files"
