name: ShellCheck + shfmt
on:
  push:
    branches: [main]
    paths:
      - '**.sh'
  pull_request:
    branches: [main]
    paths:
      - '**.sh'

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck
      - name: Run ShellCheck on shell files
        run: |
          errors=0
          for f in $(find . -name '*.sh' -not -path './.git/*' -not -path './node_modules/*' -not -path './upstream/*' -not -path './completions/*'); do
            if ! shellcheck -S error "$f" 2>/dev/null; then
              echo "FAIL: $f"
              errors=$((errors + 1))
            fi
          done
          if [ "$errors" -gt 0 ]; then
            echo "ShellCheck failed on $errors files"
            exit 1
          fi
          echo "ShellCheck passed on all shell files"
