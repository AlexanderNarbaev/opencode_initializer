global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring (feeds `up{job="prometheus"}` in dashboards)
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # OpenCode application tier (host metrics exporter on port 9464)
  - job_name: opencode
    static_configs:
      - targets: ["opencode:9464"]

  # Database metrics (postgres-exporter)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # Redis metrics (redis-exporter)
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  # Qdrant native /metrics endpoint
  - job_name: qdrant
    metrics_path: /metrics
    static_configs:
      - targets: ["qdrant:6333"]
