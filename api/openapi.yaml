openapi: 3.1.0
info:
  title: OpenCode Initializer API
  description: |
    API for OpenCode Initializer — AI-Native SDD Harness.
    
    This API provides endpoints for managing the development environment,
    including module installation, health checks, and configuration management.
  version: 12.0.0
  contact:
    name: Alexander Narbaev
    url: https://github.com/AlexanderNarbaev
    email: alex@example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:4200
    description: Local GUI dashboard
  - url: https://api.opencode-init.dev
    description: Production API

paths:
  /api/health:
    get:
      summary: Health check
      description: Check system health status
      operationId: getHealth
      tags:
        - System
      responses:
        '200':
          description: System is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '500':
          description: System is unhealthy

  /api/status:
    get:
      summary: System status
      description: Get current system status including modules, tests, and providers
      operationId: getStatus
      tags:
        - System
      responses:
        '200':
          description: System status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /api/modules:
    get:
      summary: List modules
      description: Get list of all available modules
      operationId: listModules
      tags:
        - Modules
      parameters:
        - name: status
          in: query
          description: Filter by module status
          schema:
            type: string
            enum: [installed, available, all]
            default: all
      responses:
        '200':
          description: List of modules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleListResponse'

  /api/modules/{moduleName}:
    get:
      summary: Get module details
      description: Get detailed information about a specific module
      operationId: getModule
      tags:
        - Modules
      parameters:
        - name: moduleName
          in: path
          required: true
          description: Module name
          schema:
            type: string
      responses:
        '200':
          description: Module details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModuleResponse'
        '404':
          description: Module not found

  /api/providers:
    get:
      summary: List providers
      description: Get list of all AI providers
      operationId: listProviders
      tags:
        - Providers
      responses:
        '200':
          description: List of providers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListResponse'

  /api/services:
    get:
      summary: List services
      description: Get list of all infrastructure services
      operationId: listServices
      tags:
        - Services
      responses:
        '200':
          description: List of services
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceListResponse'

  /api/services/{serviceName}/health:
    get:
      summary: Service health
      description: Check health of a specific service
      operationId: getServiceHealth
      tags:
        - Services
      parameters:
        - name: serviceName
          in: path
          required: true
          description: Service name
          schema:
            type: string
      responses:
        '200':
          description: Service health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceHealthResponse'
        '404':
          description: Service not found

  /api/config:
    get:
      summary: Get configuration
      description: Get current resolved configuration
      operationId: getConfig
      tags:
        - Configuration
      responses:
        '200':
          description: Current configuration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'

  /api/security/scan:
    post:
      summary: Run security scan
      description: Run security scan on the system
      operationId: runSecurityScan
      tags:
        - Security
      responses:
        '200':
          description: Security scan results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SecurityScanResponse'

  /api/benchmark:
    post:
      summary: Run benchmark
      description: Run performance benchmark
      operationId: runBenchmark
      tags:
        - Performance
      responses:
        '200':
          description: Benchmark results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BenchmarkResponse'

components:
  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded, unhealthy]
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          additionalProperties:
            type: string
            enum: [running, stopped, error]

    StatusResponse:
      type: object
      properties:
        version:
          type: string
        modules:
          type: integer
        tests:
          type: integer
        providers:
          type: integer
        mcp:
          type: integer
        status:
          type: string
          enum: [ok, degraded, unhealthy]

    ModuleListResponse:
      type: object
      properties:
        modules:
          type: array
          items:
            $ref: '#/components/schemas/Module'
        total:
          type: integer

    Module:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [installed, available, outdated]
        dependencies:
          type: array
          items:
            type: string

    ModuleResponse:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        version:
          type: string
        status:
          type: string
        dependencies:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            type: string
        tests:
          type: array
          items:
            type: string

    ProviderListResponse:
      type: object
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/Provider'
        total:
          type: integer

    Provider:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum: [cloud, local]
        status:
          type: string
          enum: [connected, disconnected, error]
        models:
          type: array
          items:
            type: string

    ServiceListResponse:
      type: object
      properties:
        services:
          type: array
          items:
            $ref: '#/components/schemas/Service'
        total:
          type: integer

    Service:
      type: object
      properties:
        name:
          type: string
        port:
          type: integer
        status:
          type: string
          enum: [running, stopped, error]
        health:
          type: string
          enum: [healthy, unhealthy, unknown]

    ServiceHealthResponse:
      type: object
      properties:
        name:
          type: string
        status:
          type: string
        health:
          type: string
        uptime:
          type: string
        lastCheck:
          type: string
          format: date-time

    ConfigResponse:
      type: object
      properties:
        meta:
          type: object
        user:
          type: object
        features:
          type: object
        services:
          type: object
        providers:
          type: object
        ports:
          type: object

    SecurityScanResponse:
      type: object
      properties:
        status:
          type: string
          enum: [pass, fail, warn]
        findings:
          type: array
          items:
            $ref: '#/components/schemas/SecurityFinding'
        summary:
          type: object

    SecurityFinding:
      type: object
      properties:
        severity:
          type: string
          enum: [critical, high, medium, low, info]
        type:
          type: string
        message:
          type: string
        file:
          type: string
        line:
          type: integer

    BenchmarkResponse:
      type: object
      properties:
        network:
          type: object
        disk:
          type: object
        cpu:
          type: object
        memory:
          type: object
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

tags:
  - name: System
    description: System health and status
  - name: Modules
    description: Module management
  - name: Providers
    description: AI provider management
  - name: Services
    description: Infrastructure service management
  - name: Configuration
    description: Configuration management
  - name: Security
    description: Security scanning
  - name: Performance
    description: Performance benchmarking
